---
id: mx.audioassault.amplocker
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: mx.audioassault.amplocker
tags:
  - proprietary
modules:
  - name: amplocker
    buildsystem: simple
    build-commands:
      # Standalone binary — installed to libexec; the launcher in /app/bin
      # wraps it so we can seed AmpLockerData into the user's home on
      # every launch (see amplocker-wrapper.sh).
      - install -Dm755 "Amp Locker Standalone" /app/libexec/amplocker
      - install -Dm755 amplocker-wrapper.sh /app/bin/mx.audioassault.amplocker

      # Bundled preset/IR/NAM data — shipped read-only inside the flatpak.
      # The wrapper script tops this up into
      # ~/Audio Assault/PluginData/Audio Assault/AmpLockerData/ on every
      # launch (cp -Rn: never clobber existing files).
      - mkdir -p "/app/share/AmpLocker/AmpLockerData"
      - cp -r AmpLockerData/. "/app/share/AmpLocker/AmpLockerData/"

      # VST3 + LV2 plugins (installed into Flatpak's standard plugin extension dirs)
      - mkdir -p /app/extensions/Plugins/vst3 /app/extensions/Plugins/lv2
      - cp -r "Amp Locker.vst3" /app/extensions/Plugins/vst3/
      - cp -r "Amp Locker.lv2"  /app/extensions/Plugins/lv2/

      # Desktop entry
      - install -Dm644 mx.audioassault.amplocker.desktop
        /app/share/applications/mx.audioassault.amplocker.desktop

      # Icons
      - install -Dm644 icons/128x128/apps/mx.audioassault.amplocker.png
        /app/share/icons/hicolor/128x128/apps/mx.audioassault.amplocker.png
      - install -Dm644 icons/256x256/apps/mx.audioassault.amplocker.png
        /app/share/icons/hicolor/256x256/apps/mx.audioassault.amplocker.png
      - install -Dm644 icons/512x512/apps/mx.audioassault.amplocker.png
        /app/share/icons/hicolor/512x512/apps/mx.audioassault.amplocker.png

      # AppStream metainfo
      - install -Dm644 mx.audioassault.amplocker.metainfo.xml
        /app/share/metainfo/mx.audioassault.amplocker.metainfo.xml
    cleanup:
      - "__MACOSX"
      - ".DS_Store"
      - "How To Install.txt"
    sources:
      - type: archive
        path: AmpLockerLinux.zip
        strip-components: 0
      - type: file
        path: media/mx.audioassault.amplocker.desktop
      - type: file
        path: media/amplocker-wrapper.sh
      - type: file
        path: mx.audioassault.amplocker.metainfo.xml
      - type: dir
        path: media/icons
        dest: icons

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --share=network
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-documents
  - --filesystem=home/Audio Assault:create
  # JUCE on Linux hardcodes ~/.config (it does NOT honor $XDG_CONFIG_HOME for
  # PropertiesFile or userApplicationDataDirectory paths). Amp Locker writes
  # to three places under ~/.config:
  #   - ~/.config/Amp Locker.settings       (window/audio state, JUCE properties)
  #   - ~/.config/Amp Locker/               (midi.ini, scenes.ini)
  #   - ~/.config/Audio Assault/            (activation tokens, snapshots, etc.)
  # Flatpak cannot bind-mount the lone `Amp Locker.settings` *file*, so the
  # parent directory has to be exposed. Subdir mounts (xdg-config/<sub>:create)
  # would cover the two directory cases but not the top-level settings file,
  # which then ends up on the sandbox tmpfs and is discarded on exit ("app
  # forgets last state").
  #
  # Mount the whole xdg-config to make all three persist. Trade-off: this
  # proprietary app gets read/write access to the rest of ~/.config. Reduce
  # this scope once Audio Assault's binary stops hardcoding ~/.config (or if
  # JUCE upstream starts honouring XDG_CONFIG_HOME).
  - --filesystem=xdg-config
  - --env=TMPDIR=/var/tmp

  # --- Audio latency tuning ---
  # JUCE asks RTKit for SCHED_FIFO on its audio thread. Without this D-Bus
  # name, the request fails silently inside the sandbox and the thread runs
  # at SCHED_OTHER, causing xruns at small buffer sizes. Required for any
  # low-latency operation on JACK or ALSA-direct.
  - --talk-name=org.freedesktop.RealtimeKit1
  # NOTE: do NOT set PIPEWIRE_LATENCY here. Forcing a fixed quantum (e.g.
  # 128/48000) makes PipeWire reconfigure the whole graph down to that size
  # for as long as Amp Locker is connected. If the daemon's normal quantum
  # is larger (typical desktops run 1024), the 8x drop causes crackling /
  # xruns even though there's plenty of CPU headroom. Native installs don't
  # set this env var, so they get whatever quantum the user/daemon already
  # negotiated. Let the user pick buffer size in Amp Locker's Audio Settings
  # dialog (or via `pw-metadata 0 clock.force-quantum N`) instead.
